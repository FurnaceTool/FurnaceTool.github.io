site_name: Furnace Docs
docs_dir: src/docs
site_dir: docs/
site_url: https://furnacetool.github.io/docs/
repo_url: https://github.com/furnacetool/furnacetool.github.io
copyright: "&copy; 2025 Furnace. All rights reserved."
theme:
  name: material
  logo: https://furnacetool.github.io/src/images/logo-nobg.png
  favicon: https://furnacetool.github.io/src/images/logo.png
  icon:
    furnace_fire_16: fontawesome/solid/fire
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  features:
    - content.code.copy
extra_css:
  - assets/stylesheets/docs.css
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/furnacetool
    - icon: fontawesome/brands/discord
      link: https://discord.gg/4jvpVGpeBE
markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
extra_css:
  - stylesheets/extra.css
nav:
  - Home: index.md
  - Convert: 
    - How to convert: convert/how_to_convert.md
    - Furnace.json: convert/furnacejson.md
    - Common Bugs:
      - ItemsAdder Protection: convert/bugs/ia_protection_pack.md
    - Items:
      - Armor: convert/items/armor.md
    - Font & GUI:
      - Custom Font: convert/fonts/font.md
      - GUI: convert/fonts/gui.md